.header-content{
  position:relative;z-index:1;
  padding:32px 24px 24px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.header-content h1{
  font-size:2.4rem;font-weight:900;color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,0.8);
  letter-spacing:2px;text-transform:uppercase;
}
.header-content .subtitle{color:rgba(255,255,255,0.7);margin-top:6px;font-size:0.95rem;letter-spacing:1px}

/* JACKPOT BANNER - Tinka style */
.jackpot-banner{
  position:relative;z-index:1;
  margin-top:18px;
  display:inline-flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,#003DA5 0%,#00843D 50%,#E8112D 100%);
  border:3px solid #FFD700;
  border-radius:50px;
  padding:10px 28px;
  box-shadow:0 0 0 4px rgba(255,215,0,0.15), 0 8px 24px rgba(0,0,0,0.5);
  animation:jackpotPulse 2s ease-in-out infinite;
}
@keyframes jackpotPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(255,215,0,0.15),0 8px 24px rgba(0,0,0,0.5);}
  50%{box-shadow:0 0 0 8px rgba(255,215,0,0.3),0 8px 32px rgba(0,0,0,0.6);}
}
.jackpot-banner .jp-icon{font-size:1.8rem}
.jackpot-banner .jp-text{
  font-family:'Segoe UI',system-ui,sans-serif;
  font-weight:900;
  font-size:1.3rem;
  letter-spacing:1.5px;
  color:#FFD700;
  text-shadow:0 2px 6px rgba(0,0,0,0.6), 0 0 12px rgba(255,215,0,0.4);
  text-transform:uppercase;
}
.jackpot-banner .jp-amount{
  font-size:1.6rem;
  color:#fff;
  font-weight:900;
  text-shadow:0 2px 6px rgba(0,0,0,0.6);
}
@media(max-width:600px){
  .jackpot-banner{padding:8px 16px;gap:8px}
  .jackpot-banner .jp-text{font-size:1rem}
  .jackpot-banner .jp-amount{font-size:1.2rem}
}

.trionda-colors{
  display:flex;gap:0;height:5px;width:100%;margin-top:18px;border-radius:3px;overflow:hidden;
}
.trionda-colors span{flex:1}

/* NAV TABS */
.nav-bar{
  background:#0d1520;border-bottom:1px solid var(--borde);
  padding:0 20px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;
}
.nav-tab{
  padding:14px 22px;font-size:0.88rem;font-weight:700;
  border:none;background:none;color:#6b85a0;cursor:pointer;
  border-bottom:3px solid transparent;transition:all 0.2s;
  text-transform:uppercase;letter-spacing:0.5px;
}
.nav-tab:hover{color:#fff}
.nav-tab.active{color:#fff;border-bottom-color:var(--rojo)}

/* CONTROLS */
.controls{
  background:var(--panel);padding:14px 20px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  border-bottom:1px solid var(--borde);
}
.controls input,.controls select{
  background:#0d1520;border:1px solid var(--borde);
  color:#e2e8f0;border-radius:8px;padding:7px 12px;
  font-size:0.85rem;transition:border-color 0.2s;
}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--verde)}
.controls label{color:#6b85a0;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.ctrl-g{display:flex;align-items:center;gap:8px}
.btn{padding:7px 16px;border-radius:8px;border:none;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-danger{background:#2d1010;color:#f87171;border:1px solid #5c1f1f}
.btn-danger:hover{background:#3d1515}

/* CONTAINER */
.container{max-width:1400px;margin:0 auto;padding:20px}

/* VIEWS */
.view{display:none}.view.active{display:block}

/* ===== TABLE VIEW ===== */
.table-wrap{border-radius:10px;border:1px solid var(--borde);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
thead th{
  background:#0d1520;color:#6b85a0;font-weight:700;
  text-transform:uppercase;font-size:0.68rem;letter-spacing:0.5px;
  padding:10px 8px;border-bottom:2px solid var(--borde);
  position:sticky;top:0;z-index:2;white-space:nowrap;
}
thead th:first-child{position:sticky;left:0;z-index:3;background:#0d1520}
tbody tr:nth-child(even) td{background:#141f2d}
tbody tr:nth-child(odd) td{background:#1c2d3e}
tbody tr:hover td{background:#1e3a52!important}
tbody td{padding:7px 8px;border-bottom:1px solid #1a2a3a;vertical-align:middle}
tbody td:first-child{
  position:sticky;left:0;z-index:1;
  font-weight:600;color:#e2e8f0;white-space:nowrap;
  background:inherit;border-right:1px solid var(--borde);
  min-width:130px;padding-left:14px;
}
.b{display:inline-block;padding:3px 8px;border-radius:20px;font-size:0.7rem;font-weight:700;white-space:nowrap;min-width:68px;text-align:center}
.bg{background:rgba(0,132,61,0.2);color:#4ade80;border:1px solid rgba(74,222,128,0.3)}
.bp{background:rgba(232,17,45,0.2);color:#f87171;border:1px solid rgba(248,113,113,0.3)}
.be{background:rgba(0,61,165,0.2);color:#60a5fa;border:1px solid rgba(96,165,250,0.3)}
.bt{background:rgba(139,92,246,0.2);color:#c4b5fd;border:1px solid rgba(196,181,253,0.3);min-width:unset;font-size:0.68rem}

/* ===== CARDS VIEW ===== */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel2);border-radius:14px;border:1px solid var(--borde);overflow:hidden;transition:transform 0.2s,box-shadow 0.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.card-header{
  background:linear-gradient(135deg,#001a0d,#003820 60%,#001a40);
  padding:16px 18px;display:flex;align-items:center;gap:12px;
  cursor:pointer;user-select:none;border-bottom:2px solid var(--rojo);
}
.card-header:hover{background:linear-gradient(135deg,#002010,#004828 60%,#002050)}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--verde),var(--azul));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1rem;flex-shrink:0;
  border:2px solid rgba(255,255,255,0.2);
}
.card-name{font-weight:700;color:#fff;font-size:0.95rem}
.card-sub{color:rgba(255,255,255,0.55);font-size:0.76rem;margin-top:3px;display:flex;gap:10px}
.card-toggle{margin-left:auto;color:rgba(255,255,255,0.4);font-size:0.9rem;transition:transform 0.3s}
.card-toggle.open{transform:rotate(180deg)}
.card-body{overflow:hidden;max-height:0;transition:max-height 0.4s ease}
.card-body.open{max-height:2000px}
.card-inner{padding:14px 16px}
.match-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 0;border-bottom:1px solid rgba(42,63,88,0.6);gap:8px;
}
.match-row:last-child{border-bottom:none}
.match-nm{font-size:0.76rem;color:#8fa8c8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.special-box{margin-top:12px;padding:12px;background:rgba(0,0,0,0.3);border-radius:8px;border:1px solid rgba(0,132,61,0.3)}
.special-box .sp-title{font-size:0.7rem;text-transform:uppercase;color:var(--verde);font-weight:700;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:0.76rem}
.sp-label{color:#6b85a0}.sp-value{color:#e2e8f0;font-weight:600}

/* ===== COMPARE VIEW ===== */
.comp-section{margin-bottom:8px}
.comp-match{background:var(--panel2);border-radius:10px;border:1px solid var(--borde);overflow:hidden;margin-bottom:6px}
.comp-title{
  background:#0d1520;padding:11px 16px;
  font-size:0.83rem;font-weight:700;color:#e2e8f0;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;user-select:none;
}
.comp-title:hover{background:#12202e}
.comp-body{overflow:hidden;max-height:0;transition:max-height 0.35s ease}
.comp-body.open{max-height:600px}
.comp-grid-inner{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;padding:12px 16px 14px;
}
.comp-person{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  background:rgba(0,0,0,0.2);border-radius:8px;padding:8px 10px;
  border:1px solid rgba(42,63,88,0.5);
}
.comp-pname{font-size:0.72rem;color:#8fa8c8;line-height:1.2}
.comp-arrow{color:rgba(255,255,255,0.3);font-size:0.7rem;transition:transform 0.3s}
.comp-arrow.open{transform:rotate(180deg)}
.sec-label{
  color:#6b85a0;font-size:0.72rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.6px;
  margin:20px 0 8px;padding-bottom:6px;
  border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:8px;
}

/* STATS BAR */
.stats-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.stat-pill{background:var(--panel2);border:1px solid var(--borde);border-radius:30px;padding:7px 16px;font-size:0.8rem;display:flex;align-items:center;gap:8px;color:#c5d5e8}
.dot{width:10px;height:10px;border-radius:50%}

/* NO RESULTS */
.no-res{text-align:center;padding:40px;color:#6b85a0;font-size:0.9rem}

@media(max-width:600px){
  .header-content h1{font-size:1.5rem}
  .cards-grid{grid-template-columns:1fr}
  .comp-grid-inner{grid-template-columns:repeat(2,1fr)}
  .nav-tab{padding:10px 14px;font-size:0.78rem}
}

/* ===== SCORES VIEW ===== */
.scores-banner{
  background:linear-gradient(135deg,#001a0d,#003820 60%,#001a40);
  border:1px solid var(--borde);border-radius:12px;
  padding:18px 22px;margin-bottom:16px;
  border-left:4px solid #FFD700;
}
.scores-banner-title{font-size:1rem;font-weight:700;color:#FFD700;margin-bottom:4px}
.scores-banner-sub{font-size:0.82rem;color:rgba(255,255,255,0.55)}
.result-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.result-legend-item{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:#8fa8c8;background:var(--panel2);border:1px solid var(--borde);border-radius:8px;padding:6px 12px}
.podium-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.podium-card{
  flex:1;min-width:180px;
  background:var(--panel2);border-radius:12px;border:2px solid;
  padding:18px 16px;text-align:center;
}
.podium-medal{font-size:2.2rem;line-height:1}
.podium-name{font-size:0.95rem;font-weight:700;color:#fff;margin:8px 0 4px}
.podium-pts{font-size:1.5rem;font-weight:900}
.podium-pts span{font-size:0.8rem;color:rgba(255,255,255,0.45);font-weight:400}
.scores-table-wrap{border-radius:10px;border:1px solid var(--borde);overflow-x:auto}
.scores-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.scores-table thead th{
  background:#0d1520;color:#6b85a0;font-weight:700;
  text-transform:uppercase;font-size:0.68rem;letter-spacing:0.5px;
  padding:10px 10px;border-bottom:2px solid var(--borde);
  position:sticky;top:0;z-index:2;white-space:nowrap;
}
.scores-table tbody tr:nth-child(even) td{background:#141f2d}
.scores-table tbody tr:nth-child(odd) td{background:#1c2d3e}
.scores-table tbody tr:hover td{background:#1e3a52!important}
.scores-table tbody td{padding:8px 10px;border-bottom:1px solid #1a2a3a;vertical-align:middle}
.rank-cell{font-size:1rem;text-align:center;min-width:36px}
.name-cell{font-weight:600;color:#e2e8f0;white-space:nowrap;min-width:140px}
.pts-cell{font-weight:800;color:#FFD700;font-size:0.9rem;white-space:nowrap}
.score-bar{width:100%;background:rgba(255,255,255,0.07);border-radius:20px;height:8px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:20px;transition:width 0.4s ease}
.score-hit{display:inline-block;width:24px;height:24px;border-radius:50%;background:rgba(74,222,128,0.2);color:#4ade80;text-align:center;line-height:24px;font-size:0.75rem;font-weight:700;border:1px solid rgba(74,222,128,0.4)}
.score-miss{display:inline-block;width:24px;height:24px;border-radius:50%;background:rgba(248,113,113,0.15);color:#f87171;text-align:center;line-height:24px;font-size:0.75rem;font-weight:700;border:1px solid rgba(248,113,113,0.3)}

      rows+=`<div class="match-row"><span class="match-nm">${m}</span><span class="${bc(v)}">${bl(v)}</span></div>`;
    });
    if(!rows) rows='<div style="color:#6b85a0;font-size:0.76rem;padding:6px 0">Sin partidos con ese filtro.</div>';
    h+=`<div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="avatar">${ini}</div>
        <div>
          <div class="card-name">${p.name}</div>
          <div class="card-sub">
            <span style="color:#4ade80">🟢 ${g}</span>
            <span style="color:#f87171">🔴 ${pe}</span>
            <span style="color:#60a5fa">🔵 ${em}</span>
          </div>
        </div>
        <span class="card-toggle">▼</span>
      </div>
      <div class="card-body">
        <div class="card-inner">
          ${rows}
          <div class="special-box">
            <div class="sp-title">⭐ Predicciones Especiales</div>
            <div class="sp-row"><span class="sp-label">🧤 Mejor portero</span><span class="sp-value">${sp[0]||'—'}</span></div>
            <div class="sp-row"><span class="sp-label">⚽ Máximo goleador</span><span class="sp-value">${sp[1]||'—'}</span></div>
            <div class="sp-row"><span class="sp-label">🏴 Más goles a favor</span><span class="sp-value">${sp[2]||'—'}</span></div>
            <div class="sp-row"><span class="sp-label">🇵🇾 Paraguay a octavos</span><span class="sp-value">${sp[3]||'—'}</span></div>
          </div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('cardsGrid').innerHTML=h||'<div class="no-res">Sin resultados.</div>';
}

function toggleCard(header){
  const body=header.nextElementSibling;
  const tog=header.querySelector('.card-toggle');
  const open=body.classList.toggle('open');
  tog.classList.toggle('open',open);
}

function renderCompare(){
  const vm=matches.filter(m=>!search||m.toLowerCase().includes(search));
  let h='';
  vm.forEach(m=>{
    const ri=matches.indexOf(m);
    let inner='';
    parts.forEach(p=>{
      const v=p.predictions[ri];
      if(filt&&v!==filt) return;
      inner+=`<div class="comp-person"><span class="comp-pname">${p.name}</span><span class="${bc(v)}">${bl(v)}</span></div>`;
    });
    if(!inner&&filt) return;
    h+=`<div class="comp-match">
      <div class="comp-title" onclick="toggleComp(this)">
        <span>⚽ ${m}</span><span class="comp-arrow">▼</span>
      </div>
      <div class="comp-body">
        <div class="comp-grid-inner">${inner}</div>
      </div>
    </div>`;
  });
  if(!filt&&(!search||'especiales'.includes(search))){
    h+=`<div class="sec-label">⭐ Predicciones Especiales</div>`;
    specialQs.forEach((q,qi)=>{
      let inner='';
      parts.forEach(p=>{
        const v=p.predictions[MC+qi];
        inner+=`<div class="comp-person"><span class="comp-pname">${p.name}</span><span class="b bt">${v||'—'}</span></div>`;
      });
      const ptsBadge = qi < 3
        ? '<em class="sp-pts"> +5 puntos extra</em>'
        : '<em class="sp-pts sp-pts--gold"> +3 puntos</em>';
      h+=`<div class="comp-match">
        <div class="comp-title" onclick="toggleComp(this)">
          <span>❓ ${q}${ptsBadge}</span><span class="comp-arrow">▼</span>
        </div>
        <div class="comp-body">
          <div class="comp-grid-inner">${inner}</div>
        </div>
      </div>`;
    });
  }
  document.getElementById('compareGrid').innerHTML=h||'<div class="no-res">Sin resultados.</div>';
}

function toggleComp(title){
  const body=title.nextElementSibling;
  const arr=title.querySelector('.comp-arrow');
  const open=body.classList.toggle('open');
  arr.classList.toggle('open',open);
}

function setView(v){
  view=v;
  document.querySelectorAll('.nav-tab').forEach((t,i)=>t.classList.toggle('active',['table','cards','compare','scores'][i]===v));
  document.querySelectorAll('.view').forEach((el,i)=>el.classList.toggle('active',['table','cards','compare','scores'][i]===v));
  if(v==='scores') renderScores();
  else applyFilters();
}

function applyFilters(){
  search=document.getElementById('searchInput').value.toLowerCase().trim();
  filt=document.getElementById('filterResult').value;
  if(view==='table') renderTable();
  else if(view==='cards') renderCards();
  else renderCompare();
}

function clearFilters(){
  document.getElementById('searchInput').value='';
  document.getElementById('filterResult').value='';
  search='';filt='';applyFilters();
}


// ============ RESULTADOS REALES — Google Apps Script ============
// Apps Script URL (usada en loadResults via JSONP)
let REAL_RESULTS = null;

function loadResults() {
  if (REAL_RESULTS !== null) return Promise.resolve();
  document.getElementById('scoresGrid').innerHTML =
    '<div class="scores-loading">⏳ Cargando resultados...</div>';
  return new Promise((resolve, reject) => {
    const cbName = 'pollaCB_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[cbName];
      document.body.removeChild(script);
      REAL_RESULTS = {};
      document.getElementById('scoresGrid').innerHTML =
        '<div class="scores-error">⚠️ No se pudieron cargar los resultados.<br><small>Timeout</small></div>';
      reject(new Error('Timeout'));
    }, 8000);
    window[cbName] = function(json) {
      clearTimeout(timeout);
      delete window[cbName];
      document.body.removeChild(script);
      REAL_RESULTS = {};
      Object.entries(json).forEach(([k, v]) => {
        const idx = parseInt(k);
        if (!isNaN(idx) && v) REAL_RESULTS[idx] = v;
      });
      resolve();
    };
    script.src = 'https://script.google.com/macros/s/AKfycby5dYMByvjjWEeOw5a8AF8TTZT2MusV_lay91d1dK1nhaCjhOU2Pg_LXk2ALR3Wk6munw/exec?callback=' + cbName;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      REAL_RESULTS = {};
      document.getElementById('scoresGrid').innerHTML =
        '<div class="scores-error">⚠️ No se pudieron cargar los resultados.</div>';
      reject(new Error('Script error'));
    };
    document.body.appendChild(script);
  });
}

function getScores() {
  return parts.map(p => {
    let pts = 0;
    const details = {};
    Object.entries(REAL_RESULTS).forEach(([idx, real]) => {
      const i = parseInt(idx);
      const pred = p.predictions[i];
      const hit = pred === real;
      if (hit) pts++;
      details[i] = { pred, real, hit };
    });
    return { name: p.name, pts, details };
  }).sort((a, b) => b.pts - a.pts);
}

async function renderScores() {
  await loadResults();
  if (!REAL_RESULTS || Object.keys(REAL_RESULTS).length === 0) return;
  const scored = getScores();
  const playedMatches = Object.keys(REAL_RESULTS).map(Number);
  const total = playedMatches.length;

  // Podium
  let podium = '';
  const medals = ['🥇','🥈','🥉'];
  const podiumColors = ['#FFD700','#C0C0C0','#CD7F32'];
  scored.slice(0, 3).forEach((s, rank) => {
    podium += `
      <div class="podium-card" style="border-color:${podiumColors[rank]}">
        <div class="podium-medal">${medals[rank]}</div>
        <div class="podium-name">${s.name}</div>
        <div class="podium-pts" style="color:${podiumColors[rank]}">${s.pts} <span>/ ${total} pts</span></div>
      </div>`;
  });

  // Full table
  let rows = '';
  scored.forEach((s, rank) => {
    const pct = total > 0 ? Math.round(s.pts / total * 100) : 0;
    const bar = `<div class="score-bar"><div class="score-bar-fill" style="width:${pct}%;background:${rank===0?'#FFD700':rank===1?'#C0C0C0':rank===2?'#CD7F32':'var(--verde)'}"></div></div>`;
    let matchCells = '';
    playedMatches.forEach(i => {
      const d = s.details[i];
      matchCells += `<td title="${RAW.matches[i]}"><span class="${d.hit ? 'score-hit' : 'score-miss'}">${d.hit ? '✔' : '✘'}</span></td>`;
    });
    rows += `<tr>
      <td class="rank-cell">${rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : rank + 1}</td>
      <td class="name-cell">${s.name}</td>
      <td class="pts-cell">${s.pts}/${total}</td>
      <td>${bar}</td>
      ${matchCells}
    </tr>`;
  });

  let matchHeaders = '';
  playedMatches.forEach(i => {
    const short = RAW.matches[i].replace(' vs ', ' v ');
    matchHeaders += `<th title="${RAW.matches[i]}">${short}</th>`;
  });

  const legend = playedMatches.map(i => {
    const real = REAL_RESULTS[i];
    return `<div class="result-legend-item"><span class="b ${bc(real)}">${bl(real)}</span><span>${RAW.matches[i]}</span></div>`;
  }).join('');

  document.getElementById('scoresGrid').innerHTML = `
    <div class="scores-banner">
      <div class="scores-banner-title">📅 Partidos jugados hasta la fecha</div>
      <div class="scores-banner-sub">${total} partido${total !== 1 ? 's' : ''} con resultado confirmado · 1 punto por acierto</div>
    </div>
    <div class="result-legend">${legend}</div>
    <div class="podium-row">${podium}</div>
    <div class="scores-table-wrap">
      <table class="scores-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Participante</th>
            <th>Pts</th>
            <th style="min-width:120px">Progreso</th>
            ${matchHeaders}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

renderStats();
renderTable();
</script>
